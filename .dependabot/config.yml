backend:
  name: git-gateway
  branch: main
media_folder: "site/static/img"
public_folder: "/img"
collections:
  - name: "posts"
    label: "Animais para Adoção"
    folder: "site/content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Nome do Animal", name: "title", widget: "string"}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Espécie (ex: Cão, Gato)", name: "description", widget: "text"}
      - {label: "Foto Principal", name: "image", widget: "image"}
      - {label: "Legenda da Foto", name: "imageAlt", widget: "string"}
      - {label: "História Completa", name: "body", widget: "markdown"}
      - {label: "Estado (ex: Disponível)", name: "tags", widget: "list", default: ["Disponível"]}
